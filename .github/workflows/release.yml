name: BlackMusic Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Node 20 actions are deprecated; run every JavaScript action on Node 24 (FIX-06 notes).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # FIX-07: OS code signing. Create these as GitHub repository secrets (Settings -> Secrets and variables -> Actions).
    # Missing secrets do not fail the build — that platform is simply released UNSIGNED, and the "Signing status" step says so.
    env:
      # Windows (Authenticode .pfx):  base64 -w0 cert.pfx  ->  WINDOWS_CERTIFICATE ; its password -> WINDOWS_CERTIFICATE_PASSWORD
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # macOS (Developer ID Application .p12 + notarization)
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: ""
            args: ""
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # 2.2.0: Windows is built HERE too. latest.json (the auto-update manifest) only lists platforms that were
          # built in this workflow — without Windows, `windows-x86_64` was missing and every Windows install's
          # "Check for updates" failed. (A DRAFT release also hides latest.json from /releases/latest — see below.)
          - name: Windows x64
            os: windows-latest
            target: ""
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file cmake \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev \
            patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # yt-dlp (downloaded), the whisper tiny model (downloaded), whisper-cli (compiled statically from source) and
      # the no-op open_explorer stand-in for non-Windows targets — see scripts/fetch-sidecars.mjs.
      - name: Signing status (which OS signing secrets are present)
        shell: bash
        run: |
          has() { [ -n "$1" ] && echo "present" || echo "MISSING (this build will be unsigned)"; }
          if [ "$RUNNER_OS" = "Windows" ]; then echo "Windows certificate: $(has "$WINDOWS_CERTIFICATE")"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "Apple certificate:   $(has "$APPLE_CERTIFICATE")"
            echo "Apple notarization:  $(has "$APPLE_ID")"
          fi
          echo "Updater key:         $(has "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}")"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item $pfx -Force
          $env:WINDOWS_CERTIFICATE_THUMBPRINT = $cert.Thumbprint
          node scripts/ci-set-windows-signing.mjs

      - name: Prepare bundled tools (yt-dlp, whisper.cpp, tiny model)
        shell: bash
        env:
          BUILD_WHISPER: "1"
          TAURI_TARGET: ${{ matrix.target }}
        run: node scripts/fetch-sidecars.mjs

      - name: Build and publish Tauri application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (must match the pubkey in tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled INTO the app by Vite — only public-safe values belong here.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_PROMOTIONS_API_URL: ${{ secrets.VITE_PROMOTIONS_API_URL }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          VITE_GENIUS_ACCESS_TOKEN: ${{ secrets.VITE_GENIUS_ACCESS_TOKEN }}
          VITE_LASTFM_API_KEY: ${{ secrets.VITE_LASTFM_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BlackMusic ${{ github.ref_name }}"
          releaseBody: |
            ## BlackMusic ${{ github.ref_name }}

            Downloads: Windows (MSI / NSIS), Linux (AppImage / deb), macOS Intel and Apple Silicon (dmg).
          # NOT a draft: GitHub's /releases/latest/download/latest.json ignores drafts, so a draft release made every
          # in-app "Check for updates" fail. Set this back to true only if you publish manually right after the build.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
