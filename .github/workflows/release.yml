name: BlackMusic Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: ""
            args: ""
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # 2.2.0: Windows is built HERE too. latest.json (the auto-update manifest) only lists platforms that were
          # built in this workflow — without Windows, `windows-x86_64` was missing and every Windows install's
          # "Check for updates" failed. (A DRAFT release also hides latest.json from /releases/latest — see below.)
          - name: Windows x64
            os: windows-latest
            target: ""
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file cmake \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev \
            patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # yt-dlp (downloaded), the whisper tiny model (downloaded), whisper-cli (compiled statically from source) and
      # the no-op open_explorer stand-in for non-Windows targets — see scripts/fetch-sidecars.mjs.
      - name: Prepare bundled tools (yt-dlp, whisper.cpp, tiny model)
        shell: bash
        env:
          BUILD_WHISPER: "1"
          TAURI_TARGET: ${{ matrix.target }}
        run: node scripts/fetch-sidecars.mjs

      - name: Build and publish Tauri application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (must match the pubkey in tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled INTO the app by Vite — only public-safe values belong here.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_PROMOTIONS_API_URL: ${{ secrets.VITE_PROMOTIONS_API_URL }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          VITE_GENIUS_ACCESS_TOKEN: ${{ secrets.VITE_GENIUS_ACCESS_TOKEN }}
          VITE_LASTFM_API_KEY: ${{ secrets.VITE_LASTFM_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BlackMusic ${{ github.ref_name }}"
          releaseBody: |
            ## BlackMusic ${{ github.ref_name }}

            Downloads: Windows (MSI / NSIS), Linux (AppImage / deb), macOS Intel and Apple Silicon (dmg).
          # NOT a draft: GitHub's /releases/latest/download/latest.json ignores drafts, so a draft release made every
          # in-app "Check for updates" fail. Set this back to true only if you publish manually right after the build.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
