name: BlackMusic Mobile

# Android builds fine on your Windows machine (`pnpm tauri:android`); this workflow builds iOS on a GitHub macOS runner
# (iOS can't be built on Windows) and also produces an Android artifact for convenience.
on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*.*.*"

env:
  # Node 20 actions are deprecated; run every JavaScript action on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ios:
    name: iOS (unsigned archive / signed IPA when secrets exist)
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Placeholder sidecars (desktop-only tools are not used on iOS)
        run: node scripts/fetch-sidecars.mjs --if-missing
      - name: Install XcodeGen (Tauri uses it to generate the Xcode project)
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate the Xcode project
        shell: bash
        env:
          # `tauri ios init` refuses an empty team ("apple.development-team is empty"). Without the secret, a placeholder team lets
          # it generate the project for the unsigned simulator build below; a real secret is used as-is.
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || '0000000000' }}
        run: |
          set -o pipefail
          pnpm tauri ios init --ci 2>&1 | tee ios-init.log
          test -d src-tauri/gen/apple/Sources || { echo "::error::tauri ios init did not create src-tauri/gen/apple/Sources - see ios-init.log"; exit 1; }
      # FIX-02 (iOS): add the audio-interruption observer, then let XcodeGen pick up the new files.
      - name: Add iOS audio-interruption observer
        run: |
          node scripts/ios-post-init.mjs
          if command -v xcodegen >/dev/null 2>&1; then (cd src-tauri/gen/apple && xcodegen generate); else echo "xcodegen not found — the observer files were copied but the project was not regenerated"; fi

      # FIX-06: the old job ran `tauri ios build --export-method debugging` even when APPLE_DEVELOPMENT_TEAM was empty. A
      # device archive cannot be exported without a signing team, so it always ended in "exit code 1". Two honest paths now:
      #   * secret present -> signed IPA for devices
      #   * secret absent  -> compile-and-link check for the iOS simulator (no signing needed), so CI still proves the code builds
      - name: Build iOS (signed IPA — device)
        if: env.APPLE_DEVELOPMENT_TEAM != ''
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_LASTFM_API_KEY: ${{ secrets.VITE_LASTFM_API_KEY }}
          VITE_GENIUS_ACCESS_TOKEN: ${{ secrets.VITE_GENIUS_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          pnpm tauri ios build --export-method debugging 2>&1 | tee ios-build.log

      - name: Build iOS (unsigned simulator build — no team secret)
        if: env.APPLE_DEVELOPMENT_TEAM == ''
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_LASTFM_API_KEY: ${{ secrets.VITE_LASTFM_API_KEY }}
          VITE_GENIUS_ACCESS_TOKEN: ${{ secrets.VITE_GENIUS_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          pnpm tauri ios build --debug --target aarch64-sim 2>&1 | tee ios-build.log

      # Always keep the logs: the first failing line in ios-build.log is the real cause of any red run.
      - name: Upload iOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackmusic-ios-logs
          path: |
            ios-init.log
            ios-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: blackmusic-ios
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn

  android:
    name: Android (APK/AAB)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # The action's default list is "tools platform-tools"; the legacy `tools` package no longer exists in current
          # cmdline-tools, which made sdkmanager exit 1 ("Failed to find package 'tools'"). The next step installs what we need.
          packages: ""
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-sidecars.mjs --if-missing
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
      # Optional native add-ons (FFmpeg audio + whisper.cpp). Put them in native/ yourself, OR let this step fetch them:
      #   repository variable WHISPER_CPP_REF   e.g. v1.7.6            -> clones https://github.com/ggml-org/whisper.cpp at that tag
      #   repository variable FFMPEG_KIT_AAR_URL (direct https link to an LGPL "audio" FFmpegKit .aar you are allowed to use)
      # Nothing set and nothing in native/ = the app still builds, just without on-device conversion / speech-to-text.
      - name: Fetch native add-ons (optional)
        env:
          WHISPER_CPP_REF: ${{ vars.WHISPER_CPP_REF }}
          FFMPEG_KIT_AAR_URL: ${{ vars.FFMPEG_KIT_AAR_URL }}
        run: |
          if [ ! -f native/android/whisper.cpp/CMakeLists.txt ] && [ -n "$WHISPER_CPP_REF" ]; then
            rm -rf native/android/whisper.cpp
            git clone --depth 1 --branch "$WHISPER_CPP_REF" https://github.com/ggml-org/whisper.cpp native/android/whisper.cpp
          fi
          if ! ls native/android/ffmpeg-kit/*.aar >/dev/null 2>&1 && [ -n "$FFMPEG_KIT_AAR_URL" ]; then
            curl -fL --retry 3 -o native/android/ffmpeg-kit/ffmpeg-kit-audio.aar "$FFMPEG_KIT_AAR_URL"
          fi
          echo "whisper.cpp: $([ -f native/android/whisper.cpp/CMakeLists.txt ] && echo present || echo not included)"
          echo "FFmpeg AAR:  $(ls native/android/ffmpeg-kit/*.aar >/dev/null 2>&1 && echo present || echo not included)"
      - run: pnpm tauri android init --ci
      - run: node scripts/android-post-init.mjs
      - name: Build Android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: pnpm tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: blackmusic-android
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: warn