version: 2

updates:
  # JavaScript / TypeScript dependencies
  # package.json + pnpm-lock.yaml
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "pnpm"

    commit-message:
      prefix: "deps"

  # Rust / Tauri dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "rust"

    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "deps"